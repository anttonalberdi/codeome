<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
<rect width="900" height="560" rx="14" fill="#1a1f26"/>
<rect x="110" y="28" width="680" height="64" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="150" cy="60" r="16" fill="#3a4350"/><text x="150" y="66" font-size="17" font-weight="700" fill="#d9dee5" text-anchor="middle">1</text><text x="184" y="56" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">Plan</text><text x="184" y="79" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">The agent sizes the task and writes a plan</text><path d="M450 94L450 103" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M450 112L444 103L456 103Z" fill="#3a4350"/><rect x="110" y="114" width="680" height="64" rx="12" fill="#2c3b30" stroke="#9cc59f" stroke-width="2"/><circle cx="150" cy="146" r="16" fill="#9cc59f"/><text x="150" y="152" font-size="17" font-weight="700" fill="#1a1f26" text-anchor="middle">2</text><text x="184" y="142" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">You approve the plan</text><text x="184" y="165" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">Gate 1: a button in the chat</text><rect x="704" y="132" width="68" height="28" rx="14" fill="#9cc59f" stroke="none" stroke-width="1.5"/><text x="738" y="152" font-size="14" font-weight="700" fill="#1a1f26" text-anchor="middle">YOU</text><path d="M450 180L450 189" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M450 198L444 189L456 189Z" fill="#3a4350"/><rect x="110" y="200" width="680" height="64" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="150" cy="232" r="16" fill="#3a4350"/><text x="150" y="238" font-size="17" font-weight="700" fill="#d9dee5" text-anchor="middle">3</text><text x="184" y="228" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">Specialists work</text><text x="184" y="251" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">Claude and Codex roles, tracked as job cards</text><path d="M450 266L450 275" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M450 284L444 275L456 275Z" fill="#3a4350"/><rect x="110" y="286" width="680" height="64" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="150" cy="318" r="16" fill="#3a4350"/><text x="150" y="324" font-size="17" font-weight="700" fill="#d9dee5" text-anchor="middle">4</text><text x="184" y="314" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">The other engine reviews</text><text x="184" y="337" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">Codex checks Claude’s work, or the reverse</text><path d="M450 352L450 361" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M450 370L444 361L456 361Z" fill="#3a4350"/><rect x="110" y="372" width="680" height="64" rx="12" fill="#2c3b30" stroke="#9cc59f" stroke-width="2"/><circle cx="150" cy="404" r="16" fill="#9cc59f"/><text x="150" y="410" font-size="17" font-weight="700" fill="#1a1f26" text-anchor="middle">5</text><text x="184" y="400" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">You approve the result</text><text x="184" y="423" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">Gate 2: before anything is committed</text><rect x="704" y="390" width="68" height="28" rx="14" fill="#9cc59f" stroke="none" stroke-width="1.5"/><text x="738" y="410" font-size="14" font-weight="700" fill="#1a1f26" text-anchor="middle">YOU</text><path d="M450 438L450 447" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M450 456L444 447L456 447Z" fill="#3a4350"/><rect x="110" y="458" width="680" height="64" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="150" cy="490" r="16" fill="#3a4350"/><text x="150" y="496" font-size="17" font-weight="700" fill="#d9dee5" text-anchor="middle">6</text><text x="184" y="486" font-size="20" font-weight="700" fill="#d9dee5" text-anchor="start">Commit</text><text x="184" y="509" font-size="15" font-weight="400" fill="#aab3c0" text-anchor="start">Only after your approval</text></svg>
