<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
<rect width="900" height="560" rx="14" fill="#1a1f26"/>
<text x="450" y="62" font-size="26" font-weight="700" fill="#d9dee5" text-anchor="middle">Three steps, about a minute</text><rect x="50" y="120" width="240" height="330" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="170" cy="176" r="20" fill="#9cc59f"/><text x="170" y="183" font-size="20" font-weight="700" fill="#1a1f26" text-anchor="middle">1</text><text x="170" y="252" font-size="26" font-weight="700" fill="#d9dee5" text-anchor="middle">Download</text><text x="170" y="296" font-size="17" font-weight="400" fill="#d9dee5" text-anchor="middle">the .dmg from GitHub</text><text x="170" y="324" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">arm64 = Apple silicon</text><text x="170" y="352" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">x64 = Intel</text><path d="M294 285L317 285" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M326 285L317 291L317 279Z" fill="#3a4350"/><rect x="330" y="120" width="240" height="330" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="450" cy="176" r="20" fill="#9cc59f"/><text x="450" y="183" font-size="20" font-weight="700" fill="#1a1f26" text-anchor="middle">2</text><text x="450" y="252" font-size="26" font-weight="700" fill="#d9dee5" text-anchor="middle">Drag</text><text x="450" y="296" font-size="17" font-weight="400" fill="#d9dee5" text-anchor="middle">Codeome into</text><text x="450" y="324" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">the Applications</text><text x="450" y="352" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">folder</text><path d="M574 285L597 285" stroke="#3a4350" stroke-width="2.5" fill="none"/><path d="M606 285L597 291L597 279Z" fill="#3a4350"/><rect x="610" y="120" width="240" height="330" rx="12" fill="#20262e" stroke="#3a4350" stroke-width="1.5"/><circle cx="730" cy="176" r="20" fill="#9cc59f"/><text x="730" y="183" font-size="20" font-weight="700" fill="#1a1f26" text-anchor="middle">3</text><text x="730" y="252" font-size="26" font-weight="700" fill="#d9dee5" text-anchor="middle">Open</text><text x="730" y="296" font-size="17" font-weight="400" fill="#d9dee5" text-anchor="middle">right-click, Open,</text><text x="730" y="324" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">then Open again</text><text x="730" y="352" font-size="17" font-weight="400" fill="#aab3c0" text-anchor="middle">(only the first time)</text><rect x="50" y="478" width="800" height="44" rx="10" fill="#2c3b30" stroke="#9cc59f" stroke-width="1.5"/><text x="450" y="507" font-size="16" font-weight="400" fill="#d9dee5" text-anchor="middle">The app is not signed with an Apple certificate, so macOS asks once.</text></svg>
