<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14202e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <title>Codeome</title>
  <script src="md.js" defer></script>
  <script src="render.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="topbar"><button id="back" type="button" hidden>‹ Inbox</button><h1 id="heading">Codeome</h1><span id="connection" role="status">Connecting</span></header>
    <main id="main">
      <section id="notice" class="notice" hidden role="alert"></section>
      <section id="inbox" aria-label="Inbox"><h2>Pending decisions</h2><div id="pending-list"><p class="empty">Loading decisions…</p></div><h2>Chats</h2><div id="chat-list"><p class="empty">Loading chats…</p></div></section>
      <section id="chat" aria-label="Chat" hidden><div id="chat-pending"></div><div id="log" role="log" aria-live="polite"></div><form id="reply-form"><label for="reply">Reply</label><textarea id="reply" rows="2" maxlength="20000" required></textarea><p id="reply-error" class="field-error" role="alert"></p><div class="actions"><button id="send" type="submit" class="primary">Send</button><button id="stop" type="button">Stop</button></div></form></section>
    </main>
  </div>
</body>
</html>
