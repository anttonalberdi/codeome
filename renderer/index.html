<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' file: blob: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src * file: data: blob:; frame-src file: blob: data:; font-src 'self' file: data:; worker-src 'self' file: blob:; connect-src 'self' file: data: blob:">
<title>Codeome</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="titlebar">
    <div class="tb-left">
      <span class="brand" aria-hidden="true">CODEOME</span>
      <button id="project-btn" class="project-tag ptint empty" title="Open a project folder (⌘O)"><span id="project-name">No folder open</span></button>
    </div>
    <div id="cluster" class="cluster" role="button" tabindex="0" title="HPC connection">
      <span class="c-seg" id="c-vpn"><i class="dot"></i><span>VPN</span></span>
      <span class="c-seg" id="c-hpc"><i class="dot"></i><span id="c-hpc-label">HPC</span></span>
      <span class="c-seg c-jobs" id="c-jobs"></span>
    </div>
    <div class="tb-right">
      <div id="usage" class="usage" aria-label="Claude and Codex usage limits"></div>
      <button class="icon-btn" id="settings-btn" title="Settings (⌘,)"><svg viewBox="0 0 20 20"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm7.2 2.4-1.6-.3a5.9 5.9 0 0 0-.6-1.4l.9-1.3-1.8-1.8-1.3.9a5.9 5.9 0 0 0-1.4-.6L11.1 2.8H8.9l-.3 1.6a5.9 5.9 0 0 0-1.4.6l-1.3-.9-1.8 1.8.9 1.3a5.9 5.9 0 0 0-.6 1.4l-1.6.3v2.2l1.6.3c.1.5.3 1 .6 1.4l-.9 1.3 1.8 1.8 1.3-.9c.4.3.9.5 1.4.6l.3 1.6h2.2l.3-1.6c.5-.1 1-.3 1.4-.6l1.3.9 1.8-1.8-.9-1.3c.3-.4.5-.9.6-1.4l1.6-.3V8.9Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
    </div>
  </header>

  <nav id="projects" aria-label="Open projects"></nav>

  <nav id="rail">
    <button data-view="agents" title="Agent (⌘1)"><svg viewBox="0 0 20 20"><circle cx="10" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4.8" cy="14.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="15.2" cy="14.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8.9 6.9 5.9 12.5M11.1 6.9l3 5.6M7 14.5h6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button data-view="files" class="active" title="Files (⌘2)"><svg viewBox="0 0 20 20"><path d="M3 5.5h5l1.5 1.5H17v8.5H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    <button data-action="transfer" title="File transfer (⌘8)"><svg viewBox="0 0 20 20"><path d="M3.5 7h12M12.5 4l3 3-3 3M16.5 13h-12M7.5 10l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    <button data-view="slurm" title="Slurm jobs (⌘3)"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="3.2" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="8.4" width="14" height="3.2" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="12.8" width="14" height="3.2" rx=".8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.4" cy="5.6" r=".8" fill="currentColor"/><circle cx="5.4" cy="10" r=".8" fill="currentColor"/><circle cx="5.4" cy="14.4" r=".8" fill="currentColor"/></svg></button>
    <button data-view="git" title="Git & GitHub (⌘4)"><svg viewBox="0 0 20 20"><circle cx="6" cy="5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="15" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="14" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 6.8v6.4M14 9.8c0 2.5-3 2.6-8 3.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button data-view="publish" title="Publish: Zenodo & PyPI (⌘5)"><svg viewBox="0 0 20 20"><path d="M10 13V3.5M6.5 7 10 3.5 13.5 7M4 12.5v4h12v-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    <button data-view="packages" title="Packages: Python and R (⌘6)"><svg viewBox="0 0 20 20"><path d="M10 2.8 16.5 6.5v7L10 17.2 3.5 13.5v-7Z M3.5 6.5 10 10.2l6.5-3.7M10 10.2v7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
    <button data-view="plots" title="Plots (⌘7)"><svg viewBox="0 0 20 20"><rect x="3" y="3.5" width="14" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m5.5 13.5 3-4 2.5 2.5 3.5-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
  </nav>

  <aside id="sidebar">
    <section class="view" data-view="agents" hidden></section>
    <section class="view" data-view="files"></section>
    <section class="view" data-view="slurm" hidden></section>
    <section class="view" data-view="git" hidden></section>
    <section class="view" data-view="publish" hidden></section>
    <section class="view" data-view="packages" hidden></section>
    <section class="view" data-view="plots" hidden></section>
  </aside>
  <div id="sidebar-resizer" class="resizer v"></div>

  <main id="main">
    <div id="tabs" class="tabstrip"></div>
    <div id="stage">
      <div id="monaco-host"></div>
      <div id="alt-host" hidden></div>
      <div id="welcome"></div>
    </div>
    <div id="panel-resizer" class="resizer h"></div>
    <section id="panel">
      <div class="panel-bar">
        <div id="term-tabs" class="tabstrip small"></div>
        <div class="panel-actions">
          <button id="term-new" class="btn ghost small" title="New terminal">New terminal</button>
          <button id="term-hide" class="icon-btn small" title="Hide panel (⌘J)"><svg viewBox="0 0 20 20"><path d="m5 8 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        </div>
      </div>
      <div id="term-host"></div>
    </section>
  </main>
</div>
<div id="overlay" hidden></div>
<div id="menu-pop" hidden></div>
<div id="toasts"></div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="js/core.js"></script>
<script src="js/stack.js"></script>
<script src="js/terminals.js"></script>
<script src="js/editor.js"></script>
<script src="js/rmd.js"></script>
<script src="js/files.js"></script>
<script src="js/transfer.js"></script>
<script src="js/slurm.js"></script>
<script src="js/git.js"></script>
<script src="js/publish.js"></script>
<script src="js/packages.js"></script>
<script src="js/plots.js"></script>
<script src="js/md.js"></script>
<script src="js/chat.js"></script>
<script src="js/agents.js"></script>
<script src="js/setup.js"></script>
<script src="js/login.js"></script>
<script src="js/settings.js"></script>
<script src="js/usage.js"></script>
<script src="js/projects.js"></script>
<script src="js/app.js"></script>
<!-- Monaco's AMD loader goes last so it doesn't capture the xterm UMD bundles above -->
<script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
